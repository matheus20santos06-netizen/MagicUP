<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Câmara Inteligente P2P</title>
    <style>
        body { background: #000; color: #fff; text-align: center; font-family: sans-serif; margin: 0; }
        .canvas-container { width: 100%; max-width: 500px; margin: auto; }
        canvas { width: 100%; border: 2px solid #333; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; padding: 10px; }
        button { padding: 12px; border: none; border-radius: 5px; background: #222; color: #fff; }
        .active { background: #0070f3; }
    </style>
</head>
<body>

    <div class="canvas-container">
        <canvas id="viewCanvas"></canvas>
        <video id="videoSource" autoplay playsinline style="display:none"></video>
    </div>

    <div class="btn-grid">
        <button onclick="setFilter('normal')">Normal</button>
        <button onclick="setFilter('nightvision')">Noturno</button>
        <button onclick="setFilter('thermal')">Térmico</button>
    </div>

    <div class="btn-grid">
        <button onclick="setTarget('red')" style="color:red">RED</button>
        <button onclick="setTarget('green')" style="color:green">GREEN</button>
        <button onclick="setTarget('blue')" style="color:blue">BLUE</button>
    </div>

    <script>
        let filter = 'normal', target = 'red';
        const canvas = document.getElementById('viewCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const video = document.getElementById('videoSource');

        // Inicia a câmara local
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => { video.srcObject = stream; render(); });

        function setFilter(f) { filter = f; }
        function setTarget(t) { target = t; }

        function render() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);
                let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let data = imgData.data;
                
                let minX = canvas.width, maxX = 0, minY = canvas.height, maxY = 0, found = false;

                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i], g = data[i+1], b = data[i+2];
                    
                    // Lógica de Filtros
                    if (filter === 'nightvision') { let avg = (r+g+b)/3; data[i]=0; data[i+1]=avg*2; data[i+2]=0; }
                    else if (filter === 'thermal') { let val = (r+g+b)/3; data[i]=val>150?255:0; data[i+1]=val>75?120:0; data[i+2]=val<75?200:0; }

                    // Lógica de Rastreio (Box Verde)
                    let match = false;
                    if (target === 'red' && r > 150 && g < 100 && b < 100) match = true;
                    if (target === 'green' && g > 150 && r < 100 && b < 100) match = true;
                    if (target === 'blue' && b > 150 && r < 100 && g < 100) match = true;

                    if (match) {
                        let x = (i/4)%canvas.width, y = Math.floor((i/4)/canvas.width);
                        if (x < minX) minX = x; if (x > maxX) maxX = x;
                        if (y < minY) minY = y; if (y > maxY) maxY = y;
                        found = true;
                    }
                }
                ctx.putImageData(imgData, 0, 0);
                if (found) {
                    ctx.strokeStyle = '#0f0'; ctx.lineWidth = 5;
                    ctx.strokeRect(minX, minY, maxX-minX, maxY-minY);
                }
            }
            requestAnimationFrame(render);
        }
    </script>
</body>
</html>
