<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Câmara Inteligente P2P Command</title>
    <!-- PeerJS para ligação direta Tablet <-> Telemóvel -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: #fff; text-align: center; font-family: sans-serif; }
        canvas { width: 90%; border: 3px solid #333; margin-top: 10px; }
        .controls { padding: 20px; }
        button { padding: 15px; margin: 5px; border-radius: 8px; border: none; font-weight: bold; }
    </style>
</head>
<body>
    <h3>ID do Tablet: <span id="my-id">Aguardando...</span></h3>
    <canvas id="canvas"></canvas>

    <div class="controls" id="controls">
        <button onclick="changeTarget('red')" style="background:red">Caçar Vermelho</button>
        <button onclick="changeTarget('green')" style="background:green">Caçar Verde</button>
        <button onclick="changeTarget('blue')" style="background:blue">Caçar Azul</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let target = 'red';
        let peer = new Peer(); // O ID será gerado aqui
        let conn;

        // 1. Setup do Peer-to-Peer
        peer.on('open', id => document.getElementById('my-id').innerText = id);
        peer.on('connection', c => {
            conn = c;
            conn.on('data', data => target = data); // Recebe o comando do A10s
        });

        // 2. Lógica da Câmara e Visão Computacional
        const video = document.createElement('video');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(s => { video.srcObject = s; video.play(); requestAnimationFrame(process); });

        function process() {
            if (video.readyState !== video.HAVE_ENOUGH_DATA) return requestAnimationFrame(process);
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            
            let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let d = frame.data;
            let minX = canvas.width, maxX = 0, minY = canvas.height, maxY = 0, found = false;

            for (let i = 0; i < d.length; i += 4) {
                let match = false;
                if (target === 'red' && d[i]>150 && d[i+1]<100) match = true;
                if (target === 'green' && d[i+1]>150 && d[i]<100) match = true;
                if (target === 'blue' && d[i+2]>150 && d[i]<100) match = true;

                if (match) {
                    let x = (i/4)%canvas.width, y = Math.floor((i/4)/canvas.width);
                    minX = Math.min(minX, x); maxX = Math.max(maxX, x);
                    minY = Math.min(minY, y); maxY = Math.max(maxY, y);
                    found = true;
                }
            }
            if (found) {
                ctx.strokeStyle = '#0f0'; ctx.lineWidth = 8;
                ctx.strokeRect(minX, minY, maxX-minX, maxY-minY);
            }
            requestAnimationFrame(process);
        }

        // 3. Função para o A10s enviar o comando
        function changeTarget(newColor) {
            target = newColor;
            if (conn) conn.send(newColor); // Envia para o Tablet
        }
    </script>
</body>
</html>
