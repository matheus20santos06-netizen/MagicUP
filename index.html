<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GPS 2D/3D Trace</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #0a0a0a;
      --border: #222222;
      --text: #f0f0f0;
      --muted: #888888;
      --accent: #2ea043;
      --danger: #da3633;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    header {
      padding: 8px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }
    .gps-box { font-family: monospace; font-size: 11px; color: #7ee787; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    button, select, input {
      background: #141414;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 12px;
    }
    input[type="color"] {
      padding: 2px 4px;
      width: 38px;
      height: 30px;
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button.danger { background: #3d1414; border-color: var(--danger); color: #ffb3b3; }
    button.sound-on { border-color: #2ea043; color: #7ee787; }
    button.sound-off { border-color: #444444; color: #888888; }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 8px 12px;
    }
    @media (min-width: 820px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
    }
    .card-title { font-weight: 600; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    canvas#canvas2d {
      width: 100%;
      height: 280px;
      background: #000000;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      touch-action: none;
      display: block;
    }
    #view3d {
      width: 100%;
      height: 280px;
      background: #000000;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .editor-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .editor-row label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); }
    .pts-list { max-height: 110px; overflow-y: auto; margin-top: 6px; font-family: monospace; font-size: 11px; }
    .pts-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 6px;
      border-bottom: 1px solid #1a1a1a;
      cursor: pointer;
    }
    .pts-item.active { background: #1c2b3a; }
    .color-wrap { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <strong>GPS 2D/3D Trace</strong>
    <div class="gps-box" id="gpsStatus">GPS: aguardando permissão...</div>
  </header>

  <div class="controls">
    <button class="primary" id="btnMark">+ Marcar Ponto</button>
    <button class="sound-on" id="btnSound">Som: ON</button>
    <button id="btnCloseLoop">Fechar Cerco</button>
    <button id="btnUndo">Desfazer Último</button>
    <button class="danger" id="btnRemoveSel">Remover Selecionado</button>
    <button class="danger" id="btnClear">Limpar Tudo</button>

    <label class="color-wrap" title="Cor das linhas 2D e 3D">
      Cor:
      <input type="color" id="lineColor" value="#00ff88" />
    </label>

    <select id="unitSelect" title="Unidade">
      <option value="m">Metros (m)</option>
      <option value="cm">Centímetros (cm)</option>
    </select>

    <select id="styleSelect" title="Estilo da Planta e 3D">
      <option value="wireframe">Estilo: Wireframe 3D</option>
      <option value="solid">Estilo: Sólido + Linha</option>
      <option value="blueprint">Estilo: Planta Técnica</option>
    </select>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-title">
        <span>Planta 2D (Toque no ponto para editar/remover)</span>
        <span id="summary2d" style="color:var(--muted);font-weight:400;">0 pts</span>
      </div>
      <canvas id="canvas2d"></canvas>

      <div class="editor-row">
        <label>
          Largura (X)
          <input type="number" step="0.05" id="editX" />
        </label>
        <label>
          Profundidade (Y)
          <input type="number" step="0.05" id="editY" />
        </label>
        <label>
          Ângulo (°)
          <input type="number" step="1" id="editAngle" />
        </label>
        <label>
          Altura 3D
          <input type="number" step="0.1" id="editHeight" value="2.8" />
        </label>
      </div>
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;">
        <button id="btnApplyEdit">Atualizar Ponto / Altura</button>
        <button id="btnAddSample">Exemplo Retângulo</button>
      </div>

      <div class="pts-list" id="ptsList"></div>
    </div>

    <div class="card">
      <div class="card-title">
        <span>Modelo 3D em Tempo Real</span>
        <span style="color:var(--muted);font-weight:400;">Arraste para girar</span>
      </div>
      <div id="view3d"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const state = {
      liveGPS: null,
      points: [],
      selectedIdx: null,
      closed: false,
      height: 2.8,
      unit: 'm',
      style: 'wireframe',
      lineColor: '#00ff88',
      soundEnabled: true
    };

    let audioCtx = null;
    function playBeep() {
      if (!state.soundEnabled) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!audioCtx) audioCtx = new AudioContextClass();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(920, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.13);
      } catch (_) {}
    }

    const gpsStatus = document.getElementById('gpsStatus');
    const canvas2d = document.getElementById('canvas2d');
    const ctx2d = canvas2d.getContext('2d');
    const ptsListEl = document.getElementById('ptsList');
    const summary2dEl = document.getElementById('summary2d');
    const btnSound = document.getElementById('btnSound');

    const editX = document.getElementById('editX');
    const editY = document.getElementById('editY');
    const editAngle = document.getElementById('editAngle');
    const editHeight = document.getElementById('editHeight');

    function latLonToMeters(lat, lon, refLat, refLon) {
      const dLat = (lat - refLat) * (Math.PI / 180);
      const dLon = (lon - refLon) * (Math.PI / 180);
      const meanLat = ((lat + refLat) / 2) * (Math.PI / 180);
      return {
        x: dLon * 6378137 * Math.cos(meanLat),
        y: dLat * 6378137
      };
    }

    function fmtVal(meters) {
      return state.unit === 'cm' ? (meters * 100).toFixed(0) + ' cm' : meters.toFixed(2) + ' m';
    }

    function toInputUnit(meters) {
      return state.unit === 'cm' ? Number((meters * 100).toFixed(1)) : Number(meters.toFixed(2));
    }

    function fromInputUnit(val) {
      const n = parseFloat(val);
      if (Number.isNaN(n)) return 0;
      return state.unit === 'cm' ? n / 100 : n;
    }

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          state.liveGPS = { lat: latitude, lon: longitude, acc: accuracy };
          gpsStatus.textContent = `GPS OK | ±${accuracy.toFixed(1)}m | ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
        },
        (err) => {
          gpsStatus.textContent = `GPS erro (${err.code}): ${err.message} — use Edição Manual`;
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
      );
    } else {
      gpsStatus.textContent = 'Geolocalização não suportada neste navegador';
    }

    btnSound.addEventListener('click', () => {
      state.soundEnabled = !state.soundEnabled;
      btnSound.textContent = state.soundEnabled ? 'Som: ON' : 'Som: OFF';
      btnSound.className = state.soundEnabled ? 'sound-on' : 'sound-off';
      if (state.soundEnabled) playBeep();
    });

    document.getElementById('btnMark').addEventListener('click', () => {
      if (!state.liveGPS) {
        const last = state.points[state.points.length - 1] || { x: 0, y: 0 };
        state.points.push({ x: last.x + 2, y: last.y, lat: 0, lon: 0 });
      } else if (state.points.length === 0) {
        state.points.push({ x: 0, y: 0, lat: state.liveGPS.lat, lon: state.liveGPS.lon });
      } else {
        const p0 = state.points[0];
        const m = latLonToMeters(state.liveGPS.lat, state.liveGPS.lon, p0.lat, p0.lon);
        state.points.push({ x: m.x, y: m.y, lat: state.liveGPS.lat, lon: state.liveGPS.lon });
      }
      playBeep();
      state.selectedIdx = state.points.length - 1;
      syncEditor();
      renderAll();
    });

    document.getElementById('btnCloseLoop').addEventListener('click', () => {
      if (state.points.length >= 3) state.closed = true;
      renderAll();
    });

    document.getElementById('btnUndo').addEventListener('click', () => {
      state.points.pop();
      if (state.points.length < 3) state.closed = false;
      state.selectedIdx = state.points.length ? state.points.length - 1 : null;
      syncEditor();
      renderAll();
    });

    document.getElementById('btnRemoveSel').addEventListener('click', () => {
      if (state.selectedIdx === null || !state.points[state.selectedIdx]) return;
      state.points.splice(state.selectedIdx, 1);
      if (state.points.length < 3) state.closed = false;
      state.selectedIdx = state.points.length ? Math.min(state.selectedIdx, state.points.length - 1) : null;
      syncEditor();
      renderAll();
    });

    document.getElementById('btnClear').addEventListener('click', () => {
      state.points = [];
      state.closed = false;
      state.selectedIdx = null;
      syncEditor();
      renderAll();
    });

    document.getElementById('btnAddSample').addEventListener('click', () => {
      state.points = [
        { x: 0, y: 0 },
        { x: 5, y: 0 },
        { x: 5, y: 4 },
        { x: 0, y: 4 }
      ];
      state.closed = true;
      state.selectedIdx = 1;
      syncEditor();
      renderAll();
    });

    document.getElementById('lineColor').addEventListener('input', (e) => {
      state.lineColor = e.target.value;
      renderAll();
    });

    document.getElementById('unitSelect').addEventListener('change', (e) => {
      state.unit = e.target.value;
      syncEditor();
      renderAll();
    });

    document.getElementById('styleSelect').addEventListener('change', (e) => {
      state.style = e.target.value;
      renderAll();
    });

    function syncEditor() {
      editHeight.value = toInputUnit(state.height);
      const p = state.points[state.selectedIdx];
      if (!p) {
        editX.value = '';
        editY.value = '';
        editAngle.value = '';
        return;
      }
      editX.value = toInputUnit(p.x);
      editY.value = toInputUnit(p.y);
      const prev = state.points[state.selectedIdx - 1] || { x: 0, y: 0 };
      const deg = (Math.atan2(p.y - prev.y, p.x - prev.x) * 180) / Math.PI;
      editAngle.value = deg.toFixed(1);
    }

    document.getElementById('btnApplyEdit').addEventListener('click', () => {
      state.height = Math.max(0.2, fromInputUnit(editHeight.value) || 2.8);
      const idx = state.selectedIdx;
      if (idx !== null && state.points[idx]) {
        const p = state.points[idx];
        const prev = state.points[idx - 1] || { x: 0, y: 0 };
        const newX = fromInputUnit(editX.value);
        const newY = fromInputUnit(editY.value);
        const angleInput = parseFloat(editAngle.value);
        const oldAngleDeg = (Math.atan2(p.y - prev.y, p.x - prev.x) * 180) / Math.PI;

        if (!Number.isNaN(angleInput) && Math.abs(angleInput - oldAngleDeg) > 0.05 && idx > 0) {
          const dist = Math.hypot(p.x - prev.x, p.y - prev.y);
          const rad = (angleInput * Math.PI) / 180;
          p.x = prev.x + Math.cos(rad) * dist;
          p.y = prev.y + Math.sin(rad) * dist;
        } else {
          p.x = newX;
          p.y = newY;
        }
      }
      syncEditor();
      renderAll();
    });

    function resizeCanvas2D() {
      const rect = canvas2d.getBoundingClientRect();
      canvas2d.width = rect.width * devicePixelRatio;
      canvas2d.height = rect.height * devicePixelRatio;
      ctx2d.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }

    function draw2D() {
      resizeCanvas2D();
      const w = canvas2d.clientWidth;
      const h = canvas2d.clientHeight;
      ctx2d.fillStyle = '#000000';
      ctx2d.fillRect(0, 0, w, h);

      ctx2d.strokeStyle = state.style === 'blueprint' ? '#0f2537' : '#121212';
      ctx2d.lineWidth = 1;
      for (let gx = 0; gx < w; gx += 25) {
        ctx2d.beginPath(); ctx2d.moveTo(gx, 0); ctx2d.lineTo(gx, h); ctx2d.stroke();
      }
      for (let gy = 0; gy < h; gy += 25) {
        ctx2d.beginPath(); ctx2d.moveTo(0, gy); ctx2d.lineTo(w, gy); ctx2d.stroke();
      }

      if (!state.points.length) {
        summary2dEl.textContent = '0 pts';
        return;
      }

      const scale = 28;
      const cx = w * 0.25;
      const cy = h * 0.75;
      const toScreen = (p) => ({ px: cx + p.x * scale, py: cy - p.y * scale });

      ctx2d.strokeStyle = state.lineColor;
      ctx2d.lineWidth = 2.2;
      ctx2d.beginPath();
      state.points.forEach((p, i) => {
        const { px, py } = toScreen(p);
        if (i === 0) ctx2d.moveTo(px, py);
        else ctx2d.lineTo(px, py);
      });
      if (state.closed && state.points.length >= 3) ctx2d.closePath();
      ctx2d.stroke();

      ctx2d.fillStyle = '#ffffff';
      ctx2d.font = '11px monospace';
      for (let i = 1; i < state.points.length; i++) {
        const a = toScreen(state.points[i - 1]);
        const b = toScreen(state.points[i]);
        const dist = Math.hypot(
          state.points[i].x - state.points[i - 1].x,
          state.points[i].y - state.points[i - 1].y
        );
        ctx2d.fillText(fmtVal(dist), (a.px + b.px) / 2 + 4, (a.py + b.py) / 2 - 4);
      }

      state.points.forEach((p, i) => {
        const { px, py } = toScreen(p);
        ctx2d.fillStyle = i === state.selectedIdx ? '#ff4d4d' : state.lineColor;
        ctx2d.beginPath();
        ctx2d.arc(px, py, 6, 0, Math.PI * 2);
        ctx2d.fill();
        ctx2d.fillStyle = '#e0e0e0';
        ctx2d.fillText(`P${i + 1}`, px + 8, py + 4);
      });

      summary2dEl.textContent = `${state.points.length} pts | Alt: ${fmtVal(state.height)}`;
    }

    canvas2d.addEventListener('click', (e) => {
      const rect = canvas2d.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;
      const scale = 28;
      const cx = rect.width * 0.25;
      const cy = rect.height * 0.75;

      let best = null;
      let minDist = 20;
      state.points.forEach((p, i) => {
        const px = cx + p.x * scale;
        const py = cy - p.y * scale;
        const d = Math.hypot(clickX - px, clickY - py);
        if (d < minDist) {
          minDist = d;
          best = i;
        }
      });
      if (best !== null) {
        state.selectedIdx = best;
        syncEditor();
        renderAll();
      }
    });

    function renderPointsList() {
      ptsListEl.innerHTML = '';
      state.points.forEach((p, i) => {
        const div = document.createElement('div');
        div.className = 'pts-item' + (i === state.selectedIdx ? ' active' : '');
        div.innerHTML = `<span>P${i + 1}: (${fmtVal(p.x)}, ${fmtVal(p.y)})</span><span>selecionar</span>`;
        div.onclick = () => {
          state.selectedIdx = i;
          syncEditor();
          renderAll();
        };
        ptsListEl.appendChild(div);
      });
    }

    const container3d = document.getElementById('view3d');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(45, container3d.clientWidth / container3d.clientHeight, 0.1, 500);
    camera.position.set(8, 7, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'low-power' });
    renderer.setClearColor(0x000000, 1);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(container3d.clientWidth, container3d.clientHeight);
    container3d.appendChild(renderer.domElement);

    const gridHelper = new THREE.GridHelper(20, 20, 0x222222, 0x111111);
    scene.add(gridHelper);
    scene.add(new THREE.AmbientLight(0xffffff, 1));

    const modelGroup = new THREE.Group();
    scene.add(modelGroup);

    let dragging = false, prevX = 0, prevY = 0, yaw = 0.6, pitch = 0.5, dist3d = 12;
    renderer.domElement.addEventListener('pointerdown', (e) => { dragging = true; prevX = e.clientX; prevY = e.clientY; });
    window.addEventListener('pointerup', () => { dragging = false; });
    window.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      yaw -= (e.clientX - prevX) * 0.01;
      pitch = Math.max(0.1, Math.min(1.4, pitch + (e.clientY - prevY) * 0.01));
      prevX = e.clientX; prevY = e.clientY;
    });

    function rebuild3D() {
      while (modelGroup.children.length) modelGroup.remove(modelGroup.children[0]);
      if (state.points.length < 2) return;

      const h = state.height;
      const colorHex = new THREE.Color(state.lineColor);
      const segs = [];
      for (let i = 1; i < state.points.length; i++) segs.push([state.points[i - 1], state.points[i]]);
      if (state.closed && state.points.length >= 3) {
        segs.push([state.points[state.points.length - 1], state.points[0]]);
      }

      segs.forEach(([a, b]) => {
        const dx = b.x - a.x;
        const dz = -(b.y - a.y);
        const len = Math.hypot(dx, dz);
        if (len < 0.01) return;

        const wallGeo = new THREE.BoxGeometry(len, h, 0.12);
        let obj3d;

        if (state.style === 'wireframe') {
          obj3d = new THREE.LineSegments(
            new THREE.EdgesGeometry(wallGeo),
            new THREE.LineBasicMaterial({ color: colorHex })
          );
        } else if (state.style === 'solid') {
          const group = new THREE.Group();
          const solidMesh = new THREE.Mesh(
            wallGeo,
            new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.28 })
          );
          const edges = new THREE.LineSegments(
            new THREE.EdgesGeometry(wallGeo),
            new THREE.LineBasicMaterial({ color: colorHex })
          );
          group.add(solidMesh);
          group.add(edges);
          obj3d = group;
        } else {
          obj3d = new THREE.Mesh(
            wallGeo,
            new THREE.MeshBasicMaterial({ color: colorHex, wireframe: true })
          );
        }

        obj3d.position.set((a.x + b.x) / 2, h / 2, (-(a.y + b.y)) / 2);
        obj3d.rotation.y = -Math.atan2(dz, dx);
        modelGroup.add(obj3d);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      camera.position.set(
        dist3d * Math.sin(yaw) * Math.cos(pitch),
        dist3d * Math.sin(pitch),
        dist3d * Math.cos(yaw) * Math.cos(pitch)
      );
      camera.lookAt(2, state.height / 2, -2);
      renderer.render(scene, camera);
    }
    animate();

    function renderAll() {
      draw2D();
      renderPointsList();
      rebuild3D();
    }

    window.addEventListener('resize', () => {
      renderer.setSize(container3d.clientWidth, container3d.clientHeight);
      camera.aspect = container3d.clientWidth / container3d.clientHeight;
      camera.updateProjectionMatrix();
      draw2D();
    });

    renderAll();
  </script>
</body>
</html>
