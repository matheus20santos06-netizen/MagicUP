<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GPS + Câmera 2D/3D Trace</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #0a0a0a;
      --border: #222222;
      --text: #f0f0f0;
      --muted: #888888;
      --accent: #2ea043;
      --danger: #da3633;
      --cam: #1f6feb;
      --warn: #d29922;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    header {
      padding: 8px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }
    .gps-box { font-family: monospace; font-size: 11px; color: #7ee787; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    button, select, input {
      background: #141414;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
    }
    input[type="color"] {
      padding: 2px 4px;
      width: 36px;
      height: 28px;
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button.cam-btn { background: var(--cam); border-color: var(--cam); color: #fff; font-weight: 600; }
    button.warn-btn { background: #5a3e06; border-color: var(--warn); color: #ffd97d; font-weight: 600; }
    button.danger { background: #3d1414; border-color: var(--danger); color: #ffb3b3; }
    button.sound-on { border-color: #2ea043; color: #7ee787; }
    button.sound-off { border-color: #444444; color: #888888; }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 8px 12px;
    }
    @media (min-width: 820px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
    }
    .card-title { font-weight: 600; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    canvas#canvas2d {
      width: 100%;
      height: 260px;
      background: #000000;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      touch-action: none;
      display: block;
    }
    #view3d {
      width: 100%;
      height: 260px;
      background: #000000;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .editor-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .editor-row label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); }
    .pts-list { max-height: 110px; overflow-y: auto; margin-top: 6px; font-family: monospace; font-size: 11px; }
    .pts-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 6px;
      border-bottom: 1px solid #1a1a1a;
      cursor: pointer;
    }
    .pts-item.active { background: #1c2b3a; }
    .color-wrap { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }

    /* Modal Modo Câmera */
    #camModal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 999;
      flex-direction: column;
    }
    #camModal.open { display: flex; }
    .cam-top {
      padding: 6px 10px;
      background: #0a0a0a;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .cam-stage {
      position: relative;
      flex: 1;
      min-height: 180px;
      background: #000;
      overflow: hidden;
      touch-action: none;
    }
    video#camVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    canvas#camFrozen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      pointer-events: none;
    }
    canvas#camOverlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .cam-hud {
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.78);
      border: 1px solid #333;
      border-radius: 6px;
      padding: 5px 8px;
      font-family: monospace;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }

    /* Painel inferior compacto e elevado para aparecer sem zoom */
    .cam-bottom {
      background: #080808;
      border-top: 1px solid #242424;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 54vh;
      overflow-y: auto;
    }
    .cam-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: flex-end;
    }
    .cam-field {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 10px;
      color: var(--muted);
      flex: 1 1 95px;
    }
    .cam-field input, .cam-field select {
      padding: 5px 7px;
      font-size: 12px;
      width: 100%;
    }
    .cam-lines-bar {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .cam-line-chip {
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      padding: 4px 8px;
      font-family: monospace;
      font-size: 11px;
      white-space: nowrap;
      cursor: pointer;
    }
    .cam-line-chip.active {
      border-color: #00ff88;
      background: #10261b;
    }
  </style>
</head>
<body>
  <header>
    <strong>GPS + Câmera 2D/3D</strong>
    <div class="gps-box" id="gpsStatus">GPS: aguardando permissão...</div>
  </header>

  <div class="controls">
    <button class="primary" id="btnMark">+ Ponto GPS</button>
    <button class="cam-btn" id="btnOpenCam">Modo Câmera</button>
    <button class="sound-on" id="btnSound">Som: ON</button>
    <button id="btnCloseLoop">Fechar Cerco</button>
    <button id="btnUndo">Desfazer</button>
    <button class="danger" id="btnRemoveSel">Remover Sel.</button>
    <button class="danger" id="btnClear">Limpar</button>

    <label class="color-wrap" title="Cor das linhas 2D e 3D">
      Cor:
      <input type="color" id="lineColor" value="#00ff88" />
    </label>

    <select id="unitSelect" title="Unidade">
      <option value="cm" selected>Centímetros (cm)</option>
      <option value="m">Metros (m)</option>
    </select>

    <select id="styleSelect" title="Estilo da Planta e 3D">
      <option value="wireframe">Estilo: Wireframe 3D</option>
      <option value="solid">Estilo: Sólido + Linha</option>
      <option value="blueprint">Estilo: Planta Técnica</option>
    </select>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-title">
        <span>Planta 2D (Toque no ponto para editar/remover)</span>
        <span id="summary2d" style="color:var(--muted);font-weight:400;">0 pts</span>
      </div>
      <canvas id="canvas2d"></canvas>

      <div class="editor-row">
        <label>
          Largura (X)
          <input type="number" step="0.05" id="editX" />
        </label>
        <label>
          Profundidade (Y)
          <input type="number" step="0.05" id="editY" />
        </label>
        <label>
          Ângulo (°)
          <input type="number" step="1" id="editAngle" />
        </label>
        <label>
          Altura 3D
          <input type="number" step="1" id="editHeight" value="280" />
        </label>
      </div>
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;">
        <button id="btnApplyEdit">Atualizar Ponto / Altura</button>
        <button id="btnAddSample">Exemplo Retângulo</button>
      </div>

      <div class="pts-list" id="ptsList"></div>
    </div>

    <div class="card">
      <div class="card-title">
        <span>Modelo 3D em Tempo Real</span>
        <span style="color:var(--muted);font-weight:400;">Arraste para girar</span>
      </div>
      <div id="view3d"></div>
    </div>
  </div>

  <!-- MODAL MODO CÂMERA -->
  <div id="camModal">
    <div class="cam-top">
      <button class="warn-btn" id="btnFreezeCam">Congelar</button>
      <span id="calibStatusBadge" style="font-family:monospace;font-size:10px;color:#7ee787;">Escala padrão</span>
      <button class="danger" id="btnCloseCam">Fechar</button>
    </div>

    <div class="cam-stage">
      <video id="camVideo" autoplay playsinline muted></video>
      <canvas id="camFrozen"></canvas>
      <canvas id="camOverlay"></canvas>
      <div class="cam-hud">
        <span id="camReadout">Marque pontos na tela ou toque num box para editar</span>
        <span id="camLiveDist" style="color:#00ff88;font-weight:700;">0.0 cm</span>
      </div>
    </div>

    <!-- Controles posicionados bem acima para ficarem visíveis sem zoom -->
    <div class="cam-bottom">
      <div class="cam-row">
        <label class="cam-field">
          Tipo da linha
          <select id="lineTypeSelect">
            <option value="ALTURA">Altura</option>
            <option value="LARGURA">Largura</option>
            <option value="DIAGONAL">Diagonal</option>
            <option value="CIRCULAR">Circular</option>
            <option value="CERCO">Fechar Cerco (Trapézio)</option>
          </select>
        </label>

        <label class="cam-field">
          Editar medida (<span class="unit-lbl">cm</span>)
          <input type="number" step="0.1" id="camEditMeasureInput" value="0" />
        </label>

        <label class="cam-field">
          Trena real (<span class="unit-lbl">cm</span>)
          <input type="number" step="0.5" id="calibRealInput" value="100" />
        </label>
      </div>

      <div class="cam-row">
        <button class="primary" id="btnNewLine">+ Nova Linha</button>
        <button class="cam-btn" id="btnClosePoly">Fechar Cerco</button>
        <button class="warn-btn" id="btnCalibrate">Calibrar Trena</button>
        <button id="btnUndoCamPt">Desfazer Pt</button>
        <button class="danger" id="btnDelLine">Apagar Linha</button>
      </div>

      <div class="cam-lines-bar" id="camLinesChips"></div>

      <div class="cam-row">
        <label class="cam-field" style="max-width:130px;">
          Direção na planta
          <select id="camDirSelect">
            <option value="0">Direita (0°)</option>
            <option value="90">Frente (90°)</option>
            <option value="180">Esquerda (180°)</option>
            <option value="-90">Trás (-90°)</option>
          </select>
        </label>
        <button class="cam-btn" style="flex:1;" id="btnCamCommit">+ Enviar Linha p/ Planta</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const savedPxPerMeter = parseFloat(localStorage.getItem('camPxPerMeter'));
    const hasSavedCalib = !Number.isNaN(savedPxPerMeter) && savedPxPerMeter > 0;

    const state = {
      liveGPS: null,
      points: [],
      selectedIdx: null,
      closed: false,
      height: 2.8,
      unit: 'cm',
      style: 'wireframe',
      lineColor: '#00ff88',
      soundEnabled: true,
      pxPerMeter: hasSavedCalib ? savedPxPerMeter : 250,
      calibrated: hasSavedCalib
    };

    let audioCtx = null;
    function playBeep() {
      if (!state.soundEnabled) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!audioCtx) audioCtx = new AudioContextClass();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'square';
        osc.frequency.setValueAtTime(1180, now);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(0.9, now + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      } catch (_) {}
    }

    const gpsStatus = document.getElementById('gpsStatus');
    const canvas2d = document.getElementById('canvas2d');
    const ctx2d = canvas2d.getContext('2d');
    const ptsListEl = document.getElementById('ptsList');
    const summary2dEl = document.getElementById('summary2d');
    const btnSound = document.getElementById('btnSound');

    const editX = document.getElementById('editX');
    const editY = document.getElementById('editY');
    const editAngle = document.getElementById('editAngle');
    const editHeight = document.getElementById('editHeight');

    function latLonToMeters(lat, lon, refLat, refLon) {
      const dLat = (lat - refLat) * (Math.PI / 180);
      const dLon = (lon - refLon) * (Math.PI / 180);
      const meanLat = ((lat + refLat) / 2) * (Math.PI / 180);
      return {
        x: dLon * 6378137 * Math.cos(meanLat),
        y: dLat * 6378137
      };
    }

    function fmtVal(meters) {
      return state.unit === 'cm' ? (meters * 100).toFixed(1) + ' cm' : meters.toFixed(2) + ' m';
    }

    function toInputUnit(meters) {
      return state.unit === 'cm' ? Number((meters * 100).toFixed(1)) : Number(meters.toFixed(2));
    }

    function fromInputUnit(val) {
      const n = parseFloat(val);
      if (Number.isNaN(n)) return 0;
      return state.unit === 'cm' ? n / 100 : n;
    }

    function refreshUnitLabels() {
      document.querySelectorAll('.unit-lbl').forEach((el) => {
        el.textContent = state.unit;
      });
    }

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          state.liveGPS = { lat: latitude, lon: longitude, acc: accuracy };
          gpsStatus.textContent = `GPS OK | ±${accuracy.toFixed(1)}m | ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
        },
        (err) => {
          gpsStatus.textContent = `GPS erro (${err.code}): ${err.message}`;
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
      );
    } else {
      gpsStatus.textContent = 'Geolocalização não suportada';
    }

    btnSound.addEventListener('click', () => {
      state.soundEnabled = !state.soundEnabled;
      btnSound.textContent = state.soundEnabled ? 'Som: ON' : 'Som: OFF';
      btnSound.className = state.soundEnabled ? 'sound-on' : 'sound-off';
      if (state.soundEnabled) playBeep();
    });

    document.getElementById('btnMark').addEventListener('click', () => {
      if (!state.liveGPS) {
        const last = state.points[state.points.length - 1] || { x: 0, y: 0 };
        state.points.push({ x: last.x + 2, y: last.y, lat: 0, lon: 0 });
      } else if (state.points.length === 0) {
        state.points.push({ x: 0, y: 0, lat: state.liveGPS.lat, lon: state.liveGPS.lon });
      } else {
        const p0 = state.points[0];
        const m = latLonToMeters(state.liveGPS.lat, state.liveGPS.lon, p0.lat, p0.lon);
        state.points.push({ x: m.x, y: m.y, lat: state.liveGPS.lat, lon: state.liveGPS.lon });
      }
      playBeep();
      state.selectedIdx = state.points.length - 1;
      syncEditor();
      renderAll();
    });

    document.getElementById('btnCloseLoop').addEventListener('click', () => {
      if (state.points.length >= 3) state.closed = true;
      renderAll();
    });

    document.getElementById('btnUndo').addEventListener('click', () => {
      state.points.pop();
      if (state.points.length < 3) state.closed = false;
      state.selectedIdx = state.points.length ? state.points.length - 1 : null;
      syncEditor();
      renderAll();
    });

    document.getElementById('btnRemoveSel').addEventListener('click', () => {
      if (state.selectedIdx === null || !state.points[state.selectedIdx]) return;
      state.points.splice(state.selectedIdx, 1);
      if (state.points.length < 3) state.closed = false;
      state.selectedIdx = state.points.length ? Math.min(state.selectedIdx, state.points.length - 1) : null;
      syncEditor();
      renderAll();
    });

    document.getElementById('btnClear').addEventListener('click', () => {
      state.points = [];
      state.closed = false;
      state.selectedIdx = null;
      syncEditor();
      renderAll();
    });

    document.getElementById('btnAddSample').addEventListener('click', () => {
      state.points = [
        { x: 0, y: 0 },
        { x: 5, y: 0 },
        { x: 5, y: 4 },
        { x: 0, y: 4 }
      ];
      state.closed = true;
      state.selectedIdx = 1;
      syncEditor();
      renderAll();
    });

    document.getElementById('lineColor').addEventListener('input', (e) => {
      state.lineColor = e.target.value;
      renderAll();
    });

    document.getElementById('unitSelect').addEventListener('change', (e) => {
      state.unit = e.target.value;
      refreshUnitLabels();
      syncEditor();
      syncCamEditorFromActiveLine();
      drawCamOverlay();
      renderAll();
    });

    document.getElementById('styleSelect').addEventListener('change', (e) => {
      state.style = e.target.value;
      renderAll();
    });

    function syncEditor() {
      editHeight.value = toInputUnit(state.height);
      const p = state.points[state.selectedIdx];
      if (!p) {
        editX.value = '';
        editY.value = '';
        editAngle.value = '';
        return;
      }
      editX.value = toInputUnit(p.x);
      editY.value = toInputUnit(p.y);
      const prev = state.points[state.selectedIdx - 1] || { x: 0, y: 0 };
      const deg = (Math.atan2(p.y - prev.y, p.x - prev.x) * 180) / Math.PI;
      editAngle.value = deg.toFixed(1);
    }

    document.getElementById('btnApplyEdit').addEventListener('click', () => {
      state.height = Math.max(0.2, fromInputUnit(editHeight.value) || 2.8);
      const idx = state.selectedIdx;
      if (idx !== null && state.points[idx]) {
        const p = state.points[idx];
        const prev = state.points[idx - 1] || { x: 0, y: 0 };
        const newX = fromInputUnit(editX.value);
        const newY = fromInputUnit(editY.value);
        const angleInput = parseFloat(editAngle.value);
        const oldAngleDeg = (Math.atan2(p.y - prev.y, p.x - prev.x) * 180) / Math.PI;

        if (!Number.isNaN(angleInput) && Math.abs(angleInput - oldAngleDeg) > 0.05 && idx > 0) {
          const dist = Math.hypot(p.x - prev.x, p.y - prev.y);
          const rad = (angleInput * Math.PI) / 180;
          p.x = prev.x + Math.cos(rad) * dist;
          p.y = prev.y + Math.sin(rad) * dist;
        } else {
          p.x = newX;
          p.y = newY;
        }
      }
      syncEditor();
      renderAll();
    });

    /* ================= MODO CÂMERA (MÚLTIPLAS LINHAS + BOXES) ================= */
    const camModal = document.getElementById('camModal');
    const camVideo = document.getElementById('camVideo');
    const camFrozen = document.getElementById('camFrozen');
    const camFrozenCtx = camFrozen.getContext('2d');
    const camOverlay = document.getElementById('camOverlay');
    const camCtx = camOverlay.getContext('2d');
    const camReadout = document.getElementById('camReadout');
    const camLiveDist = document.getElementById('camLiveDist');
    const camEditMeasureInput = document.getElementById('camEditMeasureInput');
    const lineTypeSelect = document.getElementById('lineTypeSelect');
    const calibRealInput = document.getElementById('calibRealInput');
    const camDirSelect = document.getElementById('camDirSelect');
    const btnFreezeCam = document.getElementById('btnFreezeCam');
    const calibStatusBadge = document.getElementById('calibStatusBadge');
    const camLinesChips = document.getElementById('camLinesChips');

    let camStream = null;
    let isFrozen = false;
    let draggingTarget = null; // { lineIdx, ptIdx }
    let boxHitAreas = []; // [{ x, y, w, h, lineIdx }]

    // Cada linha: { id, type: 'ALTURA'|'LARGURA'|'DIAGONAL'|'CIRCULAR'|'CERCO', pts: [{x,y}], closed: bool, meters: number }
    let camLines = [];
    let activeLineIdx = 0;

    function createLine(type = 'LARGURA') {
      return {
        id: Date.now() + Math.random(),
        type,
        pts: [],
        closed: false,
        meters: 0
      };
    }

    function ensureActiveLine() {
      if (!camLines.length) {
        camLines.push(createLine(lineTypeSelect.value));
        activeLineIdx = 0;
      }
      if (activeLineIdx < 0 || activeLineIdx >= camLines.length) {
        activeLineIdx = camLines.length - 1;
      }
      return camLines[activeLineIdx];
    }

    function calcLineMeters(line) {
      if (!line || line.pts.length < 2) return 0;
      if (line.type === 'CIRCULAR') {
        const px = Math.hypot(line.pts[1].x - line.pts[0].x, line.pts[1].y - line.pts[0].y);
        return px / state.pxPerMeter;
      }
      let totalPx = 0;
      for (let i = 1; i < line.pts.length; i++) {
        totalPx += Math.hypot(line.pts[i].x - line.pts[i - 1].x, line.pts[i].y - line.pts[i - 1].y);
      }
      if (line.closed && line.pts.length >= 3) {
        totalPx += Math.hypot(line.pts[0].x - line.pts[line.pts.length - 1].x, line.pts[0].y - line.pts[line.pts.length - 1].y);
      }
      return totalPx / state.pxPerMeter;
    }

    function syncCamEditorFromActiveLine() {
      const line = ensureActiveLine();
      lineTypeSelect.value = line.type;
      camEditMeasureInput.value = toInputUnit(line.meters);
      camLiveDist.textContent = `${line.type}: ${fmtVal(line.meters)}`;
      renderLineChips();
    }

    function renderLineChips() {
      camLinesChips.innerHTML = '';
      camLines.forEach((ln, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cam-line-chip' + (idx === activeLineIdx ? ' active' : '');
        btn.textContent = `#${idx + 1} ${ln.type}: ${fmtVal(ln.meters)}`;
        btn.onclick = () => {
          activeLineIdx = idx;
          syncCamEditorFromActiveLine();
          drawCamOverlay();
        };
        camLinesChips.appendChild(btn);
      });
    }

    function updateCalibBadge() {
      const pxPerCm = state.pxPerMeter / 100;
      calibStatusBadge.textContent = state.calibrated
        ? `Calibrado: ${pxPerCm.toFixed(2)} px/cm`
        : 'Escala padrão';
      calibStatusBadge.style.color = state.calibrated ? '#7ee787' : '#ffd97d';
    }

    function setFreezeState(freeze) {
      isFrozen = freeze;
      if (isFrozen) {
        const w = camOverlay.clientWidth;
        const h = camOverlay.clientHeight;
        camFrozen.width = w;
        camFrozen.height = h;
        if (camVideo.videoWidth && camVideo.videoHeight) {
          const vw = camVideo.videoWidth;
          const vh = camVideo.videoHeight;
          const scale = Math.max(w / vw, h / vh);
          const sw = vw * scale;
          const sh = vh * scale;
          camFrozenCtx.drawImage(camVideo, (w - sw) / 2, (h - sh) / 2, sw, sh);
        }
        camFrozen.style.display = 'block';
        btnFreezeCam.textContent = 'Destravar';
        btnFreezeCam.className = 'cam-btn';
        playBeep();
      } else {
        camFrozen.style.display = 'none';
        btnFreezeCam.textContent = 'Congelar';
        btnFreezeCam.className = 'warn-btn';
      }
    }

    btnFreezeCam.addEventListener('click', () => setFreezeState(!isFrozen));

    lineTypeSelect.addEventListener('change', () => {
      const line = ensureActiveLine();
      line.type = lineTypeSelect.value;
      if (line.type === 'CERCO' && line.pts.length >= 3) {
        line.closed = true;
      }
      line.meters = calcLineMeters(line);
      syncCamEditorFromActiveLine();
      drawCamOverlay();
    });

    // Edição manual da medida atual sincroniza com o box transparente na imagem
    camEditMeasureInput.addEventListener('input', () => {
      const line = ensureActiveLine();
      const valMeters = Math.max(0, fromInputUnit(camEditMeasureInput.value));
      line.meters = valMeters;
      camLiveDist.textContent = `${line.type}: ${fmtVal(line.meters)}`;
      renderLineChips();
      drawCamOverlay();
    });

    document.getElementById('btnNewLine').addEventListener('click', () => {
      camLines.push(createLine(lineTypeSelect.value));
      activeLineIdx = camLines.length - 1;
      syncCamEditorFromActiveLine();
      drawCamOverlay();
      camReadout.textContent = `Nova linha #${activeLineIdx + 1} (${lineTypeSelect.value}) — toque para marcar`;
    });

    document.getElementById('btnClosePoly').addEventListener('click', () => {
      const line = ensureActiveLine();
      if (line.pts.length >= 3) {
        line.closed = true;
        line.meters = calcLineMeters(line);
        syncCamEditorFromActiveLine();
        drawCamOverlay();
        camReadout.textContent = 'Cerco fechado! Toque no box para editar medida';
      } else {
        camReadout.textContent = 'Marque pelo menos 3 pontos para fechar o cerco';
      }
    });

    document.getElementById('btnUndoCamPt').addEventListener('click', () => {
      const line = ensureActiveLine();
      line.pts.pop();
      if (line.pts.length < 3) line.closed = false;
      line.meters = calcLineMeters(line);
      syncCamEditorFromActiveLine();
      drawCamOverlay();
    });

    document.getElementById('btnDelLine').addEventListener('click', () => {
      if (!camLines.length) return;
      camLines.splice(activeLineIdx, 1);
      if (!camLines.length) {
        camLines.push(createLine(lineTypeSelect.value));
      }
      activeLineIdx = Math.min(activeLineIdx, camLines.length - 1);
      syncCamEditorFromActiveLine();
      drawCamOverlay();
    });

    document.getElementById('btnCalibrate').addEventListener('click', () => {
      const line = ensureActiveLine();
      if (line.pts.length < 2) {
        camReadout.textContent = 'Marque 2 pontos na trena primeiro!';
        return;
      }
      const pxDist = Math.hypot(line.pts[1].x - line.pts[0].x, line.pts[1].y - line.pts[0].y);
      const realVal = parseFloat(calibRealInput.value);
      if (pxDist < 8 || Number.isNaN(realVal) || realVal <= 0) {
        camReadout.textContent = 'Informe um tamanho válido (> 0) para a trena!';
        return;
      }
      const realMeters = fromInputUnit(realVal);
      state.pxPerMeter = pxDist / realMeters;
      state.calibrated = true;
      localStorage.setItem('camPxPerMeter', String(state.pxPerMeter));

      // Recalcula todas as linhas com a nova escala
      camLines.forEach((ln) => {
        ln.meters = calcLineMeters(ln);
      });
      playBeep();
      updateCalibBadge();
      syncCamEditorFromActiveLine();
      drawCamOverlay();
      camReadout.textContent = 'Calibração confirmada! Teste agora ou adicione novas linhas';
    });

    function drawCamOverlay() {
      const w = camOverlay.clientWidth;
      const h = camOverlay.clientHeight;
      if (camOverlay.width !== w || camOverlay.height !== h) {
        camOverlay.width = w;
        camOverlay.height = h;
      }
      camCtx.clearRect(0, 0, w, h);
      boxHitAreas = [];

      const baseColor = state.lineColor;

      camLines.forEach((line, lIdx) => {
        if (!line.pts.length) return;
        const isActive = lIdx === activeLineIdx;
        const strokeCol = isActive ? baseColor : '#ffffff';

        camCtx.strokeStyle = strokeCol;
        camCtx.lineWidth = isActive ? 3 : 2;

        if (line.type === 'CIRCULAR' && line.pts.length >= 2) {
          const r = Math.hypot(line.pts[1].x - line.pts[0].x, line.pts[1].y - line.pts[0].y);
          camCtx.beginPath();
          camCtx.arc(line.pts[0].x, line.pts[0].y, r, 0, Math.PI * 2);
          camCtx.stroke();

          // Raio/diâmetro tracejado
          camCtx.beginPath();
          camCtx.moveTo(line.pts[0].x, line.pts[0].y);
          camCtx.lineTo(line.pts[1].x, line.pts[1].y);
          camCtx.stroke();
        } else {
          camCtx.beginPath();
          line.pts.forEach((p, idx) => {
            if (idx === 0) camCtx.moveTo(p.x, p.y);
            else camCtx.lineTo(p.x, p.y);
          });
          if ((line.closed || line.type === 'CERCO') && line.pts.length >= 3) {
            camCtx.closePath();
          }
          camCtx.stroke();
        }

        // Pontos de controle
        line.pts.forEach((pt, pIdx) => {
          camCtx.strokeStyle = strokeCol;
          camCtx.lineWidth = 2;
          camCtx.beginPath();
          camCtx.arc(pt.x, pt.y, isActive ? 13 : 9, 0, Math.PI * 2);
          camCtx.stroke();

          if (isActive) {
            camCtx.beginPath();
            camCtx.moveTo(pt.x - 16, pt.y); camCtx.lineTo(pt.x + 16, pt.y);
            camCtx.moveTo(pt.x, pt.y - 16); camCtx.lineTo(pt.x, pt.y + 16);
            camCtx.stroke();
          }
        });

        // Box preto meio transparente identificando tipo e medida (clicável para editar)
        const anchor = line.pts.length >= 2
          ? {
              x: (line.pts[0].x + line.pts[line.pts.length - 1].x) / 2,
              y: (line.pts[0].y + line.pts[line.pts.length - 1].y) / 2
            }
          : { x: line.pts[0].x, y: line.pts[0].y };

        const labelText = `${line.type}: ${fmtVal(line.meters)}`;
        camCtx.font = 'bold 11px monospace';
        const textW = camCtx.measureText(labelText).width;
        const boxW = Math.max(96, textW + 16);
        const boxH = 24;
        const bx = Math.max(6, Math.min(w - boxW - 6, anchor.x - boxW / 2));
        const by = Math.max(36, Math.min(h - boxH - 8, anchor.y - boxH / 2));

        camCtx.fillStyle = 'rgba(0, 0, 0, 0.78)';
        camCtx.fillRect(bx, by, boxW, boxH);
        camCtx.strokeStyle = isActive ? baseColor : 'rgba(255,255,255,0.4)';
        camCtx.lineWidth = isActive ? 2 : 1;
        camCtx.strokeRect(bx, by, boxW, boxH);

        camCtx.fillStyle = '#ffffff';
        camCtx.fillText(labelText, bx + 8, by + 16);

        boxHitAreas.push({ x: bx, y: by, w: boxW, h: boxH, lineIdx: lIdx });
      });
    }

    camOverlay.addEventListener('pointerdown', (e) => {
      const rect = camOverlay.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      // 1. Verifica se tocou em algum box preto transparente para selecionar e editar
      for (let i = boxHitAreas.length - 1; i >= 0; i--) {
        const b = boxHitAreas[i];
        if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
          activeLineIdx = b.lineIdx;
          syncCamEditorFromActiveLine();
          drawCamOverlay();
          camEditMeasureInput.focus();
          camReadout.textContent = `Editando box #${activeLineIdx + 1} (${camLines[activeLineIdx].type})`;
          return;
        }
      }

      const line = ensureActiveLine();

      // 2. Verifica se agarrou algum ponto existente para arrastar
      for (let i = 0; i < line.pts.length; i++) {
        if (Math.hypot(x - line.pts[i].x, y - line.pts[i].y) < 28) {
          draggingTarget = { lineIdx: activeLineIdx, ptIdx: i };
          return;
        }
      }

      // 3. Adiciona novo ponto na linha ativa
      if ((line.type === 'ALTURA' || line.type === 'LARGURA' || line.type === 'DIAGONAL' || line.type === 'CIRCULAR') && line.pts.length >= 2) {
        line.pts[1] = { x, y };
      } else {
        line.pts.push({ x, y });
      }
      line.meters = calcLineMeters(line);
      playBeep();
      syncCamEditorFromActiveLine();
      drawCamOverlay();
    });

    camOverlay.addEventListener('pointermove', (e) => {
      if (!draggingTarget) return;
      const rect = camOverlay.getBoundingClientRect();
      const line = camLines[draggingTarget.lineIdx];
      if (!line || !line.pts[draggingTarget.ptIdx]) return;

      line.pts[draggingTarget.ptIdx] = {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
      line.meters = calcLineMeters(line);
      if (draggingTarget.lineIdx === activeLineIdx) {
        syncCamEditorFromActiveLine();
      }
      drawCamOverlay();
    });

    window.addEventListener('pointerup', () => {
      draggingTarget = null;
    });

    document.getElementById('btnOpenCam').addEventListener('click', async () => {
      camModal.classList.add('open');
      setFreezeState(false);
      refreshUnitLabels();
      updateCalibBadge();
      if (!camLines.length) {
        camLines.push(createLine(lineTypeSelect.value));
        activeLineIdx = 0;
      }
      syncCamEditorFromActiveLine();

      try {
        camStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        camVideo.srcObject = camStream;
      } catch (_) {
        camReadout.textContent = 'Câmera indisponível — marque ou edite direto';
      }
      setTimeout(drawCamOverlay, 50);
    });

    function closeCameraModal() {
      camModal.classList.remove('open');
      setFreezeState(false);
      if (camStream) {
        camStream.getTracks().forEach((t) => t.stop());
        camStream = null;
      }
    }

    document.getElementById('btnCloseCam').addEventListener('click', closeCameraModal);

    document.getElementById('btnCamCommit').addEventListener('click', () => {
      const line = ensureActiveLine();
      const distM = Math.max(0.005, line.meters || fromInputUnit(camEditMeasureInput.value));
      const dirRad = (parseFloat(camDirSelect.value) * Math.PI) / 180;

      if (line.type === 'ALTURA') {
        state.height = Math.max(0.2, distM);
      } else {
        if (state.points.length === 0) state.points.push({ x: 0, y: 0 });
        const last = state.points[state.points.length - 1];
        state.points.push({
          x: last.x + Math.cos(dirRad) * distM,
          y: last.y + Math.sin(dirRad) * distM
        });
        state.selectedIdx = state.points.length - 1;
        if (line.type === 'CERCO' || line.closed) state.closed = true;
      }

      playBeep();
      syncEditor();
      renderAll();
      closeCameraModal();
    });

    /* ================= DESENHO 2D ================= */
    function resizeCanvas2D() {
      const rect = canvas2d.getBoundingClientRect();
      canvas2d.width = rect.width * devicePixelRatio;
      canvas2d.height = rect.height * devicePixelRatio;
      ctx2d.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }

    function draw2D() {
      resizeCanvas2D();
      const w = canvas2d.clientWidth;
      const h = canvas2d.clientHeight;
      ctx2d.fillStyle = '#000000';
      ctx2d.fillRect(0, 0, w, h);

      ctx2d.strokeStyle = state.style === 'blueprint' ? '#0f2537' : '#121212';
      ctx2d.lineWidth = 1;
      for (let gx = 0; gx < w; gx += 25) {
        ctx2d.beginPath(); ctx2d.moveTo(gx, 0); ctx2d.lineTo(gx, h); ctx2d.stroke();
      }
      for (let gy = 0; gy < h; gy += 25) {
        ctx2d.beginPath(); ctx2d.moveTo(0, gy); ctx2d.lineTo(w, gy); ctx2d.stroke();
      }

      if (!state.points.length) {
        summary2dEl.textContent = '0 pts';
        return;
      }

      const scale = 28;
      const cx = w * 0.25;
      const cy = h * 0.75;
      const toScreen = (p) => ({ px: cx + p.x * scale, py: cy - p.y * scale });

      ctx2d.strokeStyle = state.lineColor;
      ctx2d.lineWidth = 2.2;
      ctx2d.beginPath();
      state.points.forEach((p, i) => {
        const { px, py } = toScreen(p);
        if (i === 0) ctx2d.moveTo(px, py);
        else ctx2d.lineTo(px, py);
      });
      if (state.closed && state.points.length >= 3) ctx2d.closePath();
      ctx2d.stroke();

      ctx2d.fillStyle = '#ffffff';
      ctx2d.font = '11px monospace';
      for (let i = 1; i < state.points.length; i++) {
        const a = toScreen(state.points[i - 1]);
        const b = toScreen(state.points[i]);
        const dist = Math.hypot(
          state.points[i].x - state.points[i - 1].x,
          state.points[i].y - state.points[i - 1].y
        );
        ctx2d.fillText(fmtVal(dist), (a.px + b.px) / 2 + 4, (a.py + b.py) / 2 - 4);
      }

      state.points.forEach((p, i) => {
        const { px, py } = toScreen(p);
        ctx2d.fillStyle = i === state.selectedIdx ? '#ff4d4d' : state.lineColor;
        ctx2d.beginPath();
        ctx2d.arc(px, py, 6, 0, Math.PI * 2);
        ctx2d.fill();
        ctx2d.fillStyle = '#e0e0e0';
        ctx2d.fillText(`P${i + 1}`, px + 8, py + 4);
      });

      summary2dEl.textContent = `${state.points.length} pts | Alt: ${fmtVal(state.height)}`;
    }

    canvas2d.addEventListener('click', (e) => {
      const rect = canvas2d.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;
      const scale = 28;
      const cx = rect.width * 0.25;
      const cy = rect.height * 0.75;

      let best = null;
      let minDist = 20;
      state.points.forEach((p, i) => {
        const px = cx + p.x * scale;
        const py = cy - p.y * scale;
        const d = Math.hypot(clickX - px, clickY - py);
        if (d < minDist) {
          minDist = d;
          best = i;
        }
      });
      if (best !== null) {
        state.selectedIdx = best;
        syncEditor();
        renderAll();
      }
    });

    function renderPointsList() {
      ptsListEl.innerHTML = '';
      state.points.forEach((p, i) => {
        const div = document.createElement('div');
        div.className = 'pts-item' + (i === state.selectedIdx ? ' active' : '');
        div.innerHTML = `<span>P${i + 1}: (${fmtVal(p.x)}, ${fmtVal(p.y)})</span><span>selecionar</span>`;
        div.onclick = () => {
          state.selectedIdx = i;
          syncEditor();
          renderAll();
        };
        ptsListEl.appendChild(div);
      });
    }

    /* ================= CENA 3D ================= */
    const container3d = document.getElementById('view3d');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(45, container3d.clientWidth / container3d.clientHeight, 0.1, 500);
    camera.position.set(8, 7, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'low-power' });
    renderer.setClearColor(0x000000, 1);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(container3d.clientWidth, container3d.clientHeight);
    container3d.appendChild(renderer.domElement);

    const gridHelper = new THREE.GridHelper(20, 20, 0x222222, 0x111111);
    scene.add(gridHelper);
    scene.add(new THREE.AmbientLight(0xffffff, 1));

    const modelGroup = new THREE.Group();
    scene.add(modelGroup);

    let dragging = false, prevX = 0, prevY = 0, yaw = 0.6, pitch = 0.5, dist3d = 12;
    renderer.domElement.addEventListener('pointerdown', (e) => { dragging = true; prevX = e.clientX; prevY = e.clientY; });
    window.addEventListener('pointerup', () => { dragging = false; });
    window.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      yaw -= (e.clientX - prevX) * 0.01;
      pitch = Math.max(0.1, Math.min(1.4, pitch + (e.clientY - prevY) * 0.01));
      prevX = e.clientX; prevY = e.clientY;
    });

    function rebuild3D() {
      while (modelGroup.children.length) modelGroup.remove(modelGroup.children[0]);
      if (state.points.length < 2) return;

      const h = state.height;
      const colorHex = new THREE.Color(state.lineColor);
      const segs = [];
      for (let i = 1; i < state.points.length; i++) segs.push([state.points[i - 1], state.points[i]]);
      if (state.closed && state.points.length >= 3) {
        segs.push([state.points[state.points.length - 1], state.points[0]]);
      }

      segs.forEach(([a, b]) => {
        const dx = b.x - a.x;
        const dz = -(b.y - a.y);
        const len = Math.hypot(dx, dz);
        if (len < 0.01) return;

        const wallGeo = new THREE.BoxGeometry(len, h, 0.12);
        let obj3d;

        if (state.style === 'wireframe') {
          obj3d = new THREE.LineSegments(
            new THREE.EdgesGeometry(wallGeo),
            new THREE.LineBasicMaterial({ color: colorHex })
          );
        } else if (state.style === 'solid') {
          const group = new THREE.Group();
          const solidMesh = new THREE.Mesh(
            wallGeo,
            new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.28 })
          );
          const edges = new THREE.LineSegments(
            new THREE.EdgesGeometry(wallGeo),
            new THREE.LineBasicMaterial({ color: colorHex })
          );
          group.add(solidMesh);
          group.add(edges);
          obj3d = group;
        } else {
          obj3d = new THREE.Mesh(
            wallGeo,
            new THREE.MeshBasicMaterial({ color: colorHex, wireframe: true })
          );
        }

        obj3d.position.set((a.x + b.x) / 2, h / 2, (-(a.y + b.y)) / 2);
        obj3d.rotation.y = -Math.atan2(dz, dx);
        modelGroup.add(obj3d);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      camera.position.set(
        dist3d * Math.sin(yaw) * Math.cos(pitch),
        dist3d * Math.sin(pitch),
        dist3d * Math.cos(yaw) * Math.cos(pitch)
      );
      camera.lookAt(2, state.height / 2, -2);
      renderer.render(scene, camera);
    }
    animate();

    function renderAll() {
      draw2D();
      renderPointsList();
      rebuild3D();
    }

    window.addEventListener('resize', () => {
      renderer.setSize(container3d.clientWidth, container3d.clientHeight);
      camera.aspect = container3d.clientWidth / container3d.clientHeight;
      camera.updateProjectionMatrix();
      draw2D();
      if (camModal.classList.contains('open')) drawCamOverlay();
    });

    refreshUnitLabels();
    renderAll();
  </script>
</body>
</html>
