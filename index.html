<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câmera de Segurança Web</title>
    <!-- Importando o PeerJS para conexão P2P gratuita -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
        video { width: 100%; max-width: 500px; border-radius: 10px; background: #000; transform: scaleX(-1); }
        .controls { margin-top: 15px; }
        button { padding: 12px 20px; font-size: 16px; background: #0070f3; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #0051a2; }
        input { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; width: 80%; max-width: 300px; margin-bottom: 10px; }
        .hidden { display: none; }
        #status { font-weight: bold; margin: 10px 0; color: #ffcc00; }
    </style>
</head>
<body>

    <h2>Câmera de Segurança P2P</h2>
    <div id="status">Desconectado</div>

    <!-- Menu Inicial -->
    <div id="menu">
        <p>Escolha o modo deste dispositivo:</p>
        <button onclick="iniciarModoCamera()">Modo Câmera (Tablet)</button>
        <br><br>
        <button onclick="iniciarModoMonitor()">Modo Monitor (Celular)</button>
    </div>

    <!-- Tela da Câmera (Tablet) -->
    <div id="camera-view" class="hidden">
        <h3>Transmitindo Câmera</h3>
        <p>Seu ID de Conexão:</p>
        <h2 id="my-peer-id" style="color: #00ff00;">Gerando...</h2>
        <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <!-- Tela do Monitor (Celular) -->
    <div id="monitor-view" class="hidden">
        <h3>Visualizador</h3>
        <input type="text" id="remote-id-input" placeholder="Digite o ID do Tablet">
        <br>
        <button onclick="conectarAoTablet()">Conectar à Câmera</button>
        <br><br>
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="controls">
            <button onclick="tirarFoto()">Tirar Foto</button>
        </div>
        <canvas id="snapshot" class="hidden"></canvas>
    </div>

    <script>
        let peer;
        let localStream;
        let currentCall;

        // Inicializa o Peer
        function initPeer(isCamera = false) {
            peer = new Peer();

            peer.on('open', (id) => {
                if (isCamera) {
                    document.getElementById('my-peer-id').innerText = id;
                    document.getElementById('status').innerText = 'Aguardando conexão...';
                } else {
                    document.getElementById('status').innerText = 'Pronto para conectar';
                }
            });

            if (isCamera) {
                peer.on('call', (call) => {
                    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
                        .then((stream) => {
                            localStream = stream;
                            document.getElementById('localVideo').srcObject = stream;
                            call.answer(stream); // Responde à chamada enviando o vídeo
                            document.getElementById('status').innerText = 'Transmitindo ao vivo!';
                            
                            // Detecção básica de movimento usando canvas invisível
                            ativarDetectorDeMovimento(stream);
                        })
                        .catch((err) => alert('Erro ao acessar a câmera: ' + err));
                });
            }
        }

        function iniciarModoCamera() {
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('camera-view').classList.remove('hidden');
            initPeer(true);
        }

        function iniciarModoMonitor() {
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('monitor-view').classList.remove('hidden');
            initPeer(false);
        }

        function conectarAoTablet() {
            const remoteId = document.getElementById('remote-id-input').value;
            if (!remoteId) return alert('Insira o ID do tablet!');

            document.getElementById('status').innerText = 'Conectando...';
            
            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then((stream) => {
                    const call = peer.call(remoteId, stream);
                    currentCall = call;
                    
                    call.on('stream', (remoteStream) => {
                        document.getElementById('remoteVideo').srcObject = remoteStream;
                        document.getElementById('status').innerText = 'Conectado com sucesso!';
                    });

                    call.on('close', () => {
                        document.getElementById('status').innerText = 'Conexão encerrada.';
                    });
                })
                .catch((err) => alert('Erro de mídia: ' + err));
        }

        function tirarFoto() {
            const video = document.getElementById('remoteVideo');
            const canvas = document.getElementById('snapshot');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageURL = canvas.toDataURL('image/png');
            const a = document.createElement('a');
            a.href = imageURL;
            a.download = 'seguranca-captura.png';
            a.click();
        }

        // Detecção de movimento simples via JavaScript (Analisa diferença de pixels no Canvas)
        function ativarDetectorDeMovimento(stream) {
            const video = document.getElementById('localVideo');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 160; // Resolução baixa para processar rápido
            canvas.height = 120;

            let prevData = null;

            setInterval(() => {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const currData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

                if (prevData) {
                    let diff = 0;
                    for (let i = 0; i < currData.inArrayLength || i < currData.length; i += 4) {
                        // Compara canal Vermelho dos pixels
                        if (Math.abs(currData[i] - prevData[i]) > 30) {
                            diff++;
                        }
                    }

                    // Se a diferença de pixels passar de um limite, considera movimento
                    if (diff > 2000) {
                        console.log('Movimento detectado!');
                        document.getElementById('status').innerText = '⚠️ Movimento Detectado!';
                        setTimeout(() => {
                            document.getElementById('status').innerText = 'Transmitindo ao vivo!';
                        }, 3000);
                    }
                }
                prevData = currData;
            }, 1000); // Analisa a cada 1 segundo
        }
    </script>
</body>
</html>
