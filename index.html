<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câmara Inteligente com Rastreio</title>
    <!-- Importando tracking.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/tracking-min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/data/color-min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #121212; 
            color: #fff; 
            text-align: center; 
            margin: 0; 
            padding: 10px; 
            overflow-x: hidden; 
        }
        
        .video-container {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 500px;
            margin-top: 10px;
        }

        /* Vídeo real a correr em background mas pronto */
        #webcamVideo { 
            display: none;
        }

        /* Canvas principal visível que mostra tudo e onde o tracking atua */
        canvas { 
            width: 100%; 
            height: auto;
            border-radius: 10px; 
            background: #222; 
            display: block;
        }

        .controls { margin-top: 15px; }
        button { 
            padding: 10px 15px; 
            font-size: 14px; 
            background: #0070f3; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            margin: 4px; 
        }
        button:hover { background: #0051a2; }
        .danger { background: #e00000; }
        .danger:hover { background: #a00000; }
        
        #status { font-weight: bold; margin: 10px 0; color: #ffcc00; font-size: 1.1em; }
        .panel { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>Câmara Inteligente com Rastreio</h2>
    <div id="status">Toque no botão para iniciar</div>

    <div id="menu">
        <button onclick="iniciarCamara()" style="font-size: 18px; padding: 15px 25px;">Ligar Câmara</button>
    </div>

    <!-- Ecrã da Câmara e Processamento -->
    <div id="camera-view" style="display: none;">
        <div class="video-container">
            <video id="webcamVideo" autoplay playsinline muted></video>
            <canvas id="processedCanvas"></canvas>
        </div>

        <div class="controls">
            <button onclick="tirarFoto()">Tirar Foto</button>
            <button class="danger" onclick="pararCamara()">Desligar</button>
        </div>

        <div class="panel">
            <p><strong>Modos de Visão:</strong></p>
            <button onclick="mudarFiltro('normal')">Normal</button>
            <button onclick="mudarFiltro('nightvision')">Noturno (Verde)</button>
            <button onclick="mudarFiltro('thermal')">Térmico (Calor)</button>
        </div>

        <div class="panel">
            <p><strong>Rastrear Cor (Exibe Box Verde):</strong></p>
            <button onclick="trackColor('magenta')" style="background: magenta">Magenta</button>
            <button onclick="trackColor('cyan')" style="background: cyan; color: black">Ciano</button>
            <button onclick="trackColor('yellow')" style="background: yellow; color: black">Amarelo</button>
            <button onclick="trackColor('red')" style="background: red">Vermelho</button>
        </div>
    </div>

    <script>
        let tracker;
        let trackerTask;
        let currentColor = 'magenta';
        let currentFilter = 'normal';
        let detectedRects = [];
        let mediaStream = null;

        function iniciarCamara() {
            const video = document.getElementById('webcamVideo');
            const statusDiv = document.getElementById('status');

            statusDiv.innerText = 'A pedir permissão da câmara...';

            const constraints = {
                video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'environment' },
                audio: false
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then((stream) => {
                    mediaStream = stream;
                    video.srcObject = stream;
                    
                    video.onloadedmetadata = () => {
                        video.play().then(() => {
                            document.getElementById('menu').style.display = 'none';
                            document.getElementById('camera-view').style.display = 'block';
                            statusDiv.innerText = 'Câmara ativa!';

                            const canvas = document.getElementById('processedCanvas');
                            canvas.width = video.videoWidth || 640;
                            canvas.height = video.videoHeight || 480;

                            // Inicia o rastreio diretamente no canvas visual para garantir eficácia
                            configurarRastreamento(canvas);
                            iniciarLoopProcessamento(video, canvas);
                        }).catch(err => {
                            statusDiv.innerText = 'Erro ao reproduzir: ' + err.message;
                        });
                    };
                })
                .catch((err) => {
                    console.error(err);
                    statusDiv.innerText = 'Erro: ' + err.name;
                    alert('Erro ao aceder à câmara: ' + err.message);
                });
        }

        function pararCamara() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            if (trackerTask) {
                trackerTask.stop();
            }
            document.getElementById('camera-view').style.display = 'none';
            document.getElementById('menu').style.display = 'block';
            document.getElementById('status').innerText = 'Câmara desligada';
        }

        function configurarRastreamento(elementToTrack) {
            if (trackerTask) {
                trackerTask.stop();
            }

            // Regista a cor vermelha personalizada caso não exista
            if (!tracking.ColorTracker.getColor('red')) {
                tracking.ColorTracker.registerColor('red', function(r, g, b) {
                    return r > 120 && g < 70 && b < 70;
                });
            }

            tracker = new tracking.ColorTracker([currentColor]);

            // tracking.track com o canvas configurado para detetar cores em tempo real
            trackerTask = tracking.track(elementToTrack, tracker, { camera: false, implicit: true });

            tracker.on('track', function(event) {
                detectedRects = event.data;
            });
        }

        function trackColor(color) {
            currentColor = color;
            document.getElementById('status').innerText = 'A rastrear cor: ' + color;
            const canvas = document.getElementById('processedCanvas');
            configurarRastreamento(canvas);
        }

        function mudarFiltro(filtro) {
            currentFilter = filtro;
            document.getElementById('status').innerText = 'Modo de visão: ' + filtro;
        }

        function iniciarLoopProcessamento(video, canvas) {
            const ctx = canvas.getContext('2d');

            function loop() {
                if (video.paused || video.ended) {
                    requestAnimationFrame(loop);
                    return;
                }

                if (canvas.width !== video.videoWidth && video.videoWidth > 0) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                }

                // 1. Desenha o frame limpo da câmara de base
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // 2. Aplica filtros visuais se selecionados (Noturno ou Térmico)
                if (currentFilter !== 'normal') {
                    let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    let data = frame.data;

                    for (let i = 0; i < data.length; i += 4) {
                        let r = data[i];
                        let g = data[i + 1];
                        let b = data[i + 2];

                        if (currentFilter === 'nightvision') {
                            let avg = (r + g + b) / 3;
                            data[i] = 0;
                            data[i + 1] = avg * 2; // Realça o verde
                            data[i + 2] = 0;
                        } else if (currentFilter === 'thermal') {
                            let brightness = (r + g + b) / 3;
                            if (brightness > 160) {
                                data[i] = 255; data[i + 1] = 255; data[i + 2] = 255;
                            } else if (brightness > 80) {
                                data[i] = 255; data[i + 1] = 120; data[i + 2] = 0;
                            } else {
                                data[i] = 0; data[i + 1] = 0; data[i + 2] = 180;
                            }
                        }
                    }
                    ctx.putImageData(frame, 0, 0);
                }

                // 3. Desenha as caixas verdes por cima se o tracking detetar o objeto selecionado
                if (detectedRects && detectedRects.length > 0) {
                    detectedRects.forEach(rect => {
                        ctx.strokeStyle = '#00FF00';
                        ctx.lineWidth = 4;
                        ctx.strokeRect(rect.x, rect.y, rect.width, rect.height);
                        
                        ctx.fillStyle = '#00FF00';
                        ctx.font = '16px Arial';
                        ctx.fillText(`Alvo Detetado`, rect.x, rect.y > 20 ? rect.y - 5 : 20);
                    });
                }

                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        function tirarFoto() {
            const canvas = document.getElementById('processedCanvas');
            const imageURL = canvas.toDataURL('image/png');
            const a = document.createElement('a');
            a.href = imageURL;
            a.download = 'foto-capturada.png';
            a.click();
        }
    </script>
</body>
</html>
