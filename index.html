<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Local - Câmara Inteligente</title>
    <!-- Importando tracking.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/tracking-min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/data/color-min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 10px; overflow-x: hidden; }
        
        .video-container {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 500px;
        }

        /* O vídeo agora fica visível para garantir renderização correta no mobile */
        video { 
            width: 100%; 
            border-radius: 10px; 
            background: #000; 
            display: block;
        }

        canvas {
            display: none; /* O processamento é feito por cima ou via drawImage direto */
        }

        #outputCanvas {
            width: 100%;
            border-radius: 10px;
            background: #000;
            display: block;
        }

        .controls { margin-top: 15px; }
        button { padding: 10px 15px; font-size: 14px; background: #0070f3; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 4px; }
        button:hover { background: #0051a2; }
        #status { font-weight: bold; margin: 10px 0; color: #ffcc00; font-size: 1.1em; }
        
        .panel { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>Teste Local - Câmara Inteligente</h2>
    <div id="status">A solicitar câmara...</div>

    <div class="video-container">
        <!-- Vídeo visível para evitar tela preta no mobile -->
        <video id="webcamVideo" autoplay playsinline muted></video>
        <!-- Canvas onde aplicamos filtros e caixas -->
        <canvas id="outputCanvas"></canvas>
    </div>

    <div class="panel">
        <p><strong>Modos de Visão:</strong></p>
        <button onclick="mudarFiltro('normal')">Normal</button>
        <button onclick="mudarFiltro('nightvision')">Noturno (Verde)</button>
        <button onclick="mudarFiltro('thermal')">Térmico (Calor)</button>
    </div>

    <div class="panel">
        <p><strong>Rastrear Cor (Exibe Box Verde):</strong></p>
        <button onclick="trackColor('magenta')" style="background: magenta">Magenta</button>
        <button onclick="trackColor('cyan')" style="background: cyan; color: black">Ciano</button>
        <button onclick="trackColor('yellow')" style="background: yellow; color: black">Amarelo</button>
        <button onclick="trackColor('red')" style="background: red">Vermelho</button>
    </div>

    <div class="panel">
        <button onclick="alternarCamara()" style="background: #28a745;">Alternar Câmara (Frente/Trás)</button>
    </div>

    <script>
        let tracker;
        let trackerTask;
        let currentColor = 'magenta';
        let currentFilter = 'normal';
        let detectedRects = [];
        let usarCamaraTraseira = true;
        let streamAtivo = null;

        const videoElement = document.getElementById('webcamVideo');
        const canvasElement = document.getElementById('outputCanvas');
        const ctx = canvasElement.getContext('2d');

        function iniciarCamaraLocal() {
            document.getElementById('status').innerText = 'A ligar à câmara...';

            if (streamAtivo) {
                streamAtivo.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: { 
                    facingMode: usarCamaraTraseira ? { exact: 'environment' } : 'user',
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                },
                audio: false
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then((stream) => {
                    streamAtivo = stream;
                    videoElement.srcObject = stream;
                    
                    videoElement.onloadedmetadata = () => {
                        videoElement.play();
                        canvasElement.width = videoElement.videoWidth || 640;
                        canvasElement.height = videoElement.videoHeight || 480;

                        // Esconde o elemento de vídeo nativo e usa o canvas processado
                        videoElement.style.display = 'none';
                        canvasElement.style.display = 'block';

                        configurarRastreamento();
                        iniciarLoopProcessamento();
                        
                        document.getElementById('status').innerText = 'Câmara Ativa e A a funcionar!';
                    };
                })
                .catch((err) => {
                    // Fallback caso o 'exact: environment' falhe em alguns dispositivos
                    console.warn('Tentando fallback de câmara...', err);
                    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                        .then((stream) => {
                            streamAtivo = stream;
                            videoElement.srcObject = stream;
                            videoElement.onloadedmetadata = () => {
                                videoElement.play();
                                canvasElement.width = videoElement.videoWidth || 640;
                                canvasElement.height = videoElement.videoHeight || 480;
                                videoElement.style.display = 'none';
                                canvasElement.style.display = 'block';

                                configurarRastreamento();
                                iniciarLoopProcessamento();
                                document.getElementById('status').innerText = 'Câmara Ativa (Modo Compatibilidade)!';
                            };
                        })
                        .catch((e) => {
                            document.getElementById('status').innerText = 'Erro de permissão da câmara';
                            alert('Erro ao aceder à câmara: ' + e);
                        });
                });
        }

        function alternarCamara() {
            usarCamaraTraseira = !usarCamaraTraseira;
            iniciarCamaraLocal();
        }

        function mudarFiltro(filtro) {
            currentFilter = filtro;
            document.getElementById('status').innerText = 'Modo de visão: ' + filtro;
        }

        function configurarRastreamento() {
            if (trackerTask) {
                trackerTask.stop();
            }

            if (!tracking.ColorTracker.getColor('red')) {
                tracking.ColorTracker.registerColor('red', function(r, g, b) {
                    return r > 120 && g < 70 && b < 70;
                });
            }

            tracker = new tracking.ColorTracker([currentColor]);
            tracker.setStepSize(1.7);

            // Rastreia diretamente no elemento de vídeo oculto/nativo
            trackerTask = tracking.track(videoElement, tracker, { camera: false, implicit: true });

            tracker.on('track', function(event) {
                detectedRects = event.data;
            });
        }

        function trackColor(color) {
            currentColor = color;
            document.getElementById('status').innerText = 'A rastrear cor: ' + color;
            configurarRastreamento();
        }

        function iniciarLoopProcessamento() {
            function loop() {
                if (videoElement.paused || videoElement.ended) {
                    requestAnimationFrame(loop);
                    return;
                }

                // Desenha o frame atual da câmara no canvas principal
                ctx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);

                // Aplica filtros visuais se selecionados
                if (currentFilter !== 'normal') {
                    let frame = ctx.getImageData(0, 0, canvasElement.width, canvasElement.height);
                    let data = frame.data;

                    for (let i = 0; i < data.length; i += 4) {
                        let r = data[i];
                        let g = data[i + 1];
                        let b = data[i + 2];

                        if (currentFilter === 'nightvision') {
                            let avg = (r + g + b) / 3;
                            data[i] = 0;
                            data[i + 1] = avg * 2; // Realça o verde
                            data[i + 2] = 0;
                        } else if (currentFilter === 'thermal') {
                            let brightness = (r + g + b) / 3;
                            if (brightness > 160) {
                                data[i] = 255; data[i + 1] = 255; data[i + 2] = 255; // Quente
                            } else if (brightness > 80) {
                                data[i] = 255; data[i + 1] = 120; data[i + 2] = 0;   // Médio
                            } else {
                                data[i] = 0; data[i + 1] = 0; data[i + 2] = 180;     // Frio
                            }
                        }
                    }
                    ctx.putImageData(frame, 0, 0);
                }

                // Desenha a caixa verde de rastreio por cima
                if (detectedRects && detectedRects.length > 0) {
                    detectedRects.forEach(rect => {
                        ctx.strokeStyle = '#00FF00';
                        ctx.lineWidth = 4;
                        ctx.strokeRect(rect.x, rect.y, rect.width, rect.height);
                        
                        ctx.fillStyle = '#00FF00';
                        ctx.font = '16px Arial';
                        ctx.fillText(`Alvo Detetado`, rect.x, rect.y > 20 ? rect.y - 5 : 20);
                    });
                }

                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        // Inicia automaticamente ao carregar
        window.onload = () => {
            iniciarCamaraLocal();
        };
    </script>
</body>
</html>
