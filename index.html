<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câmara Inteligente no Telemóvel</title>
    <!-- Importando tracking.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/tracking-min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/data/color-min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #121212; 
            color: #fff; 
            text-align: center; 
            margin: 0; 
            padding: 10px; 
            overflow-x: hidden; 
        }
        
        .video-container {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 500px;
            margin-top: 10px;
        }

        video, canvas { 
            width: 100%; 
            border-radius: 10px; 
            background: #000; 
            display: block;
        }

        /* Vídeo original escondido apenas para o motor ler os frames */
        #hiddenVideo { 
            position: absolute;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .controls { margin-top: 15px; }
        button { 
            padding: 10px 15px; 
            font-size: 14px; 
            background: #0070f3; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            margin: 4px; 
        }
        button:hover { background: #0051a2; }
        .danger { background: #e00000; }
        .danger:hover { background: #a00000; }
        
        #status { font-weight: bold; margin: 10px 0; color: #ffcc00; font-size: 1.1em; }
        .panel { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>Câmara Inteligente (Modo Único)</h2>
    <div id="status">Toque no botão para iniciar</div>

    <div id="menu">
        <button onclick="iniciarCamara()" style="font-size: 18px; padding: 15px 25px;">Ligar Câmara do Telemóvel</button>
    </div>

    <!-- Ecrã da Câmara e Processamento -->
    <div id="camera-view" style="display: none;">
        <div class="video-container">
            <!-- Atributos essenciais para evitar tela preta no mobile -->
            <video id="hiddenVideo" autoplay playsinline muted></video>
            <canvas id="processedCanvas"></canvas>
        </div>

        <div class="controls">
            <button onclick="tirarFoto()">Tirar Foto</button>
            <button id="btnRec" onclick="alternarGravacao()">Gravar Vídeo</button>
            <button class="danger" onclick="pararCamara()">Desligar</button>
        </div>

        <div class="panel">
            <p><strong>Modos de Visão:</strong></p>
            <button onclick="mudarFiltro('normal')">Normal</button>
            <button onclick="mudarFiltro('nightvision')">Noturno (Verde)</button>
            <button onclick="mudarFiltro('thermal')">Térmico (Calor)</button>
        </div>

        <div class="panel">
            <p><strong>Rastrear Cor (Exibe Box Verde):</strong></p>
            <button onclick="trackColor('magenta')" style="background: magenta">Magenta</button>
            <button onclick="trackColor('cyan')" style="background: cyan; color: black">Ciano</button>
            <button onclick="trackColor('yellow')" style="background: yellow; color: black">Amarelo</button>
            <button onclick="trackColor('red')" style="background: red">Vermelho</button>
        </div>
    </div>

    <script>
        let tracker;
        let trackerTask;
        let currentColor = 'magenta';
        let currentFilter = 'normal';
        let detectedRects = [];
        let mediaStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;

        function iniciarCamara() {
            const hiddenVideo = document.getElementById('hiddenVideo');
            const canvas = document.getElementById('processedCanvas');
            const statusDiv = document.getElementById('status');

            statusDiv.innerText = 'A solicitar acesso à câmara...';

            // Tenta usar a câmara traseira por predefinição no telemóvel
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: { ideal: 'environment' } }, 
                audio: true 
            })
            .then((stream) => {
                mediaStream = stream;
                hiddenVideo.srcObject = stream;
                
                // Força a reprodução para prevenir tela preta no mobile
                hiddenVideo.play().then(() => {
                    document.getElementById('menu').style.display = 'none';
                    document.getElementById('camera-view').style.display = 'block';
                    statusDiv.innerText = 'Câmara ativa e a processar!';

                    canvas.width = hiddenVideo.videoWidth || 640;
                    canvas.height = hiddenVideo.videoHeight || 480;

                    configurarRastreamento(hiddenVideo);
                    iniciarProcessamentoVisual(hiddenVideo, canvas);
                }).catch(e => {
                    statusDiv.innerText = 'Erro ao reproduzir vídeo. Toque no ecrã.';
                    console.error(e);
                });
            })
            .catch((err) => {
                console.error(err);
                statusDiv.innerText = 'Erro: Permissão negada ou câmara ocupada.';
                alert('Não foi possível aceder à câmara: ' + err.message);
            });
        }

        function pararCamara() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            if (trackerTask) {
                trackerTask.stop();
            }
            document.getElementById('camera-view').style.display = 'none';
            document.getElementById('menu').style.display = 'block';
            document.getElementById('status').innerText = 'Câmara desligada';
        }

        function configurarRastreamento(videoElement) {
            if (trackerTask) {
                trackerTask.stop();
            }

            if (!tracking.ColorTracker.getColor('red')) {
                tracking.ColorTracker.registerColor('red', function(r, g, b) {
                    return r > 120 && g < 70 && b < 70;
                });
            }

            tracker = new tracking.ColorTracker([currentColor]);
            tracker.setStepSize(1.7);

            trackerTask = tracking.track(videoElement, tracker, { camera: false, implicit: true });

            tracker.on('track', function(event) {
                detectedRects = event.data;
            });
        }

        function trackColor(color) {
            currentColor = color;
            document.getElementById('status').innerText = 'A rastrear cor: ' + color;
            configurarRastreamento(document.getElementById('hiddenVideo'));
        }

        function mudarFiltro(filtro) {
            currentFilter = filtro;
            document.getElementById('status').innerText = 'Modo de visão: ' + filtro;
        }

        function iniciarProcessamentoVisual(video, canvas) {
            const ctx = canvas.getContext('2d');

            function loop() {
                if (video.paused || video.ended) {
                    requestAnimationFrame(loop);
                    return;
                }

                // Desenha o frame original da câmara no canvas
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Aplica filtros visuais (Noturno / Térmico)
                if (currentFilter !== 'normal') {
                    let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    let data = frame.data;

                    for (let i = 0; i < data.length; i += 4) {
                        let r = data[i];
                        let g = data[i + 1];
                        let b = data[i + 2];

                        if (currentFilter === 'nightvision') {
                            let avg = (r + g + b) / 3;
                            data[i] = 0;
                            data[i + 1] = avg * 2;
                            data[i + 2] = 0;
                        } else if (currentFilter === 'thermal') {
                            let brightness = (r + g + b) / 3;
                            if (brightness > 160) {
                                data[i] = 255; data[i + 1] = 255; data[i + 2] = 255;
                            } else if (brightness > 80) {
                                data[i] = 255; data[i + 1] = 120; data[i + 2] = 0;
                            } else {
                                data[i] = 0; data[i + 1] = 0; data[i + 2] = 180;
                            }
                        }
                    }
                    ctx.putImageData(frame, 0, 0);
                }

                // Desenha caixas de rastreio de cor se encontrar objetos
                if (detectedRects && detectedRects.length > 0) {
                    detectedRects.forEach(rect => {
                        ctx.strokeStyle = '#00FF00';
                        ctx.lineWidth = 4;
                        ctx.strokeRect(rect.x, rect.y, rect.width, rect.height);
                        
                        ctx.fillStyle = '#00FF00';
                        ctx.font = '16px Arial';
                        ctx.fillText(`Alvo Detetado`, rect.x, rect.y > 20 ? rect.y - 5 : 20);
                    });
                }

                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        function tirarFoto() {
            const canvas = document.getElementById('processedCanvas');
            const imageURL = canvas.toDataURL('image/png');
            const a = document.createElement('a');
            a.href = imageURL;
            a.download = 'foto-processada.png';
            a.click();
        }

        function alternarGravacao() {
            const canvas = document.getElementById('processedCanvas');
            const btnRec = document.getElementById('btnRec');

            if (!isRecording) {
                recordedChunks = [];
                // Captura o fluxo diretamente do canvas já com os filtros e rastreio aplicados
                const canvasStream = canvas.captureStream(25);
                
                // Junta o som da câmara se estiver disponível
                if (mediaStream && mediaStream.getAudioTracks().length > 0) {
                    canvasStream.addTrack(mediaStream.getAudioTracks()[0]);
                }

                try {
                    mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
                } catch (e) {
                    try {
                        mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/mp4' });
                    } catch (err) {
                        mediaRecorder = new MediaRecorder(canvasStream);
                    }
                }

                mediaRecorder.ondataavailable = function(event) {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = function() {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = 'video-processado.webm';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                };

                mediaRecorder.start();
                isRecording = true;
                btnRec.innerText = 'Parar Gravação';
                btnRec.style.background = '#e00000';
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btnRec.innerText = 'Gravar Vídeo';
                btnRec.style.background = '#0070f3';
            }
        }
    </script>
</body>
</html>
